{{- if and (eq .Values.agents.llm.provider "claude") (not .Values.anthropic.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "research-agent.anthropic.secretName" . }}
  labels:
    {{- include "research-agent.componentLabels" (dict "root" . "component" "agents") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.anthropic.existingSecretKey }}: {{ required "anthropic.apiKey or anthropic.existingSecret is required when agents.llm.provider=claude" .Values.anthropic.apiKey | quote }}
{{- end }}
{{- if and .Values.langfuse.enabled (not .Values.langfuse.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "research-agent.langfuse.secretName" . }}
  labels:
    {{- include "research-agent.componentLabels" (dict "root" . "component" "agents") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.langfuse.publicKeyKey }}: {{ required "langfuse.publicKey is required when langfuse.enabled=true" .Values.langfuse.publicKey | quote }}
  {{ .Values.langfuse.secretKeyKey }}: {{ required "langfuse.secretKey is required when langfuse.enabled=true" .Values.langfuse.secretKey | quote }}
{{- end }}
{{- if not .Values.researchService.security.existingSecret }}
{{- $name := include "research-agent.apiKeys.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $security := .Values.researchService.security }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "research-agent.componentLabels" (dict "root" . "component" "research-service") | nindent 4 }}
type: Opaque
data:
  {{ $security.apiKeyKey }}: {{ include "research-agent.secretValue" (dict "value" $security.apiKey "existing" $existing "key" $security.apiKeyKey) }}
  {{ $security.adminApiKeyKey }}: {{ include "research-agent.secretValue" (dict "value" $security.adminApiKey "existing" $existing "key" $security.adminApiKeyKey) }}
{{- end }}
{{- if and .Values.infra.enabled (not .Values.infra.postgres.existingSecret) }}
{{- $name := include "research-agent.postgres.name" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "research-agent.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
type: Opaque
data:
  {{- if .Values.infra.postgres.password }}
  password: {{ .Values.infra.postgres.password | b64enc | quote }}
  {{- else if and $existing $existing.data (hasKey $existing.data "password") }}
  password: {{ index $existing.data "password" | quote }}
  {{- else }}
  password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
{{- end }}
